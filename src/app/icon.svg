<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#1a1410"/>
  <!-- postage stamp with perforated edge -->
  <rect x="5.5" y="5.5" width="21" height="21" rx="3"
        fill="none" stroke="#e0913a" stroke-width="2"
        stroke-dasharray="1.6 1.7" stroke-linecap="round"/>
  <!-- serif P monogram -->
  <text x="16" y="22.2" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="17"
        font-weight="700" fill="#e0913a">P</text>
</svg>
